name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The extension has no dependencies and no build step, so there is
      # nothing to install -- these checks run straight against the tree.
      - name: Prettier
        run: npx --yes prettier@3 --check .

      - name: JavaScript parses
        run: |
          node --check content/content.js
          node --check popup/popup.js

      - name: manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
